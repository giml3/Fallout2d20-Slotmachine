<!doctype html><html lang="en"><meta charset="utf-8"><title>Sidebar launcher check</title><link rel="stylesheet" href="/styles/slots.css"><style>body{background:#202428;color:#eee;font:16px sans-serif;padding:30px}#sidebar-tabs{display:flex;align-items:center}#sidebar-tabs menu{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0}button{background:#363e44;color:white;border:1px solid #72787c;border-radius:4px;min-height:32px}.fa-coins:before{content:'◉'}</style><h1>Player sidebar navigation fixture</h1><p>This checks the real launcher code against a sidebar layout without a Settings tab.</p><nav id="sidebar-tabs"><menu class="flexcol"><li><button data-tab="chat">Chat</button></li><li><button data-tab="combat">Combat</button></li><li><button data-tab="actors">Actors</button></li><li><button data-action="toggleState">Collapse</button></li></menu></nav><p id="result" role="status">Not opened</p><script type="module">import{installSidebarLauncher}from'/scripts/sidebar.js';let clicks=0;const open=()=>{document.querySelector('#result').textContent=`Machine opened ${++clicks} time(s)`;};installSidebarLauncher(document,open);installSidebarLauncher(document,open);document.querySelector('#sidebar-tabs').addEventListener('click',()=>{document.querySelector('#result').textContent='ERROR: launcher click reached tab navigation';});</script></html>
